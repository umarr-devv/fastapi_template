version: "3.9"

services:
    web:
        build: .
        container_name: app
        ports:
            - "8000:8000"
        volumes:
            - ./app:/code/app
        env_file:
            - .env-docker
        depends_on:
            - db

    migrate:
        build: .
        command: alembic upgrade head
        volumes:
            - ./app:/code/app
        env_file:
            - .env-docker
        depends_on:
            - db

    db:
        image: postgres:latest
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: ${PG_USER}
            POSTGRES_PASSWORD: ${PG_PASSWORD}
            POSTGRES_DB: ${PG_DATABASE}
        env_file:
            - .env-docker
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
